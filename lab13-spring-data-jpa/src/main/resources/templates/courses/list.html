<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Môn Học</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Quản Lý Môn Học</h2>
    <div class="my-3">
        <a href="/courses/create" class="btn btn-primary">Thêm Môn Học</a>
        <a href="/students" class="btn btn-secondary ms-2">Quản Lý Sinh Viên</a>
    </div>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th><th>Mã Môn</th><th>Tên Môn</th><th>Số Tín Chỉ</th><th>Hành Động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${courses}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.courseCode}"></td>
                <td th:text="${c.courseName}"></td>
                <td th:text="${c.credits}"></td>
                <td>
                    <a th:href="@{/courses/edit/{id}(id=${c.id})}" class="btn btn-sm btn-warning">Sửa</a>
                    <a th:href="@{/courses/delete/{id}(id=${c.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa môn này?')">Xóa</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
