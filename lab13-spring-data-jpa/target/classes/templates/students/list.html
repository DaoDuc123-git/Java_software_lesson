<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Sinh Viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Quản Lý Sinh Viên</h2>
    <div class="d-flex justify-content-between my-3">
        <a href="/students/create" class="btn btn-primary">Thêm Sinh Viên</a>
        <form action="/students" method="get" class="d-flex w-50">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control me-2" placeholder="Tìm theo tên...">
            <button type="submit" class="btn btn-outline-success">Tìm</button>
        </form>
    </div>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th><th>Mã SV</th><th>Họ Tên</th><th>Email</th><th>Lớp</th><th>Hành Động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s : ${students}">
                <td th:text="${s.id}"></td>
                <td th:text="${s.studentCode}"></td>
                <td th:text="${s.fullName}"></td>
                <td th:text="${s.email}"></td>
                <td th:text="${s.className}"></td>
                <td>
                    <a th:href="@{/students/edit/{id}(id=${s.id})}" class="btn btn-sm btn-warning">Sửa</a>
                    <a th:href="@{/students/delete/{id}(id=${s.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
