<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông Tin Sinh Viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2 th:text="${student.id == null ? 'Thêm Mới Sinh Viên' : 'Cập Nhật Sinh Viên'}"></h2>
    <form th:action="@{/students/save}" th:object="${student}" method="post" class="w-50">
        <input type="hidden" th:field="*{id}" />
        <div class="mb-3">
            <label>Mã Sinh Viên:</label>
            <input type="text" th:field="*{studentCode}" class="form-control" required />
        </div>
        <div class="mb-3">
            <label>Họ và Tên:</label>
            <input type="text" th:field="*{fullName}" class="form-control" required />
        </div>
        <div class="mb-3">
            <label>Email:</label>
            <input type="email" th:field="*{email}" class="form-control" />
        </div>
        <div class="mb-3">
            <label>Lớp:</label>
            <input type="text" th:field="*{className}" class="form-control" />
        </div>
        <button type="submit" class="btn btn-success">Lưu</button>
        <a href="/students" class="btn btn-secondary">Hủy</a>
    </form>
</body>
</html>
