<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông Tin Môn Học</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2 th:text="${course.id == null ? 'Thêm Mới Môn Học' : 'Cập Nhật Môn Học'}"></h2>
    <form th:action="@{/courses/save}" th:object="${course}" method="post" class="w-50">
        <input type="hidden" th:field="*{id}" />
        <div class="mb-3">
            <label>Mã Môn Học:</label>
            <input type="text" th:field="*{courseCode}" class="form-control" required />
        </div>
        <div class="mb-3">
            <label>Tên Môn Học:</label>
            <input type="text" th:field="*{courseName}" class="form-control" required />
        </div>
        <div class="mb-3">
            <label>Số Tín Chỉ:</label>
            <input type="number" th:field="*{credits}" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-success">Lưu</button>
        <a href="/courses" class="btn btn-secondary">Hủy</a>
    </form>
</body>
</html>
