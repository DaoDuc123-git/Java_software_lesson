<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form Sinh Viên</title>
    <style>
        .error { color: red; font-size: 0.9em; display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 120px; }
    </style>
</head>
<body>
    <h2 th:text="${student.id == null ? 'Thêm Sinh Viên' : 'Chỉnh Sửa Sinh Viên'}">Form</h2>

    <form th:action="@{/students/save}" th:object="${student}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label>Mã sinh viên:</label>
            <input type="text" th:field="*{studentCode}" />
            <span class="error" th:if="${#fields.hasErrors('studentCode')}" th:errors="*{studentCode}"></span>
        </div>

        <div class="form-group">
            <label>Họ tên:</label>
            <input type="text" th:field="*{fullName}" />
            <span class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="text" th:field="*{email}" />
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label>Lớp:</label>
            <input type="text" th:field="*{className}" />
            <span class="error" th:if="${#fields.hasErrors('className')}" th:errors="*{className}"></span>
        </div>

        <button type="submit">Lưu</button>
        <a th:href="@{/students}">Hủy</a>
    </form>
</body>
</html>
